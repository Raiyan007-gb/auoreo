[project]
name = "auoreo"
version = "0.1.0"
description = "AUOREO — a filesystem-native agent harness: agents, tools, skills, workflows and prompts are discovered from folders at runtime."
readme = "README.md"
authors = [{ name = "AUOREO contributors" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.22.1,<0.23",
    "alembic>=1.19,<2",
    "apscheduler>=3.11,<4",
    "croniter>=6.2.4",
    "cryptography>=50.0.2,<51",
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.25,<5",
    "keyring>=25.7.0,<26",
    "lark>=1.3.1,<2",
    "litellm>=1.106.3,<2",
    "markdownify>=1.2.3,<2",
    "mcp>=2.3.0,<3",
    "mss>=10.2.0,<11",
    "openpyxl>=3.1.5,<4",
    "pdfplumber>=0.11.10,<0.12",
    "pillow>=13.0.0,<14",
    "playwright==1.63.*",
    "psutil>=6,<8",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "pypdf>=6.21.2,<7",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "sqlite-vec==0.1.*",
    "typer>=0.27.3,<0.28",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[project.scripts]
auoreo = "auoreo.cli.main:main"

[project.optional-dependencies]
rtc = [
    "aiortc>=1.15,<2",
    "numpy>=2",
]
sandbox-docker = [
    "docker>=7,<8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.17.2",
    "types-croniter>=6.2.4.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures", "sdk/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "ASYNC109"]  # FastAPI/Typer defaults; explicit timeout params are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]  # short polling loops are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["tests/fixtures/", "sdk/python/"]

[[tool.mypy.overrides]]
module = ["litellm.*", "sqlite_vec.*", "markdownify.*", "keyring.*", "lark.*", "aiortc.*", "av.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]  # M5a automation
module = ["apscheduler.*", "tzlocal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Item .* is using the `ReadOnly` qualifier:UserWarning"]
