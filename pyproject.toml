[project]
name = "auoreo"
version = "0.1.0"
description = "AUOREO — a filesystem-native agent harness: agents, tools, skills, workflows and prompts are discovered from folders at runtime."
readme = "README.md"
authors = [{ name = "AUOREO contributors" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.22.1,<0.23",
    "alembic>=1.19,<2",
    "apscheduler>=3.11,<4",
    "croniter>=6.2.4",
    "cryptography>=50.0.2,<51",
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.25,<5",
    "keyring>=25.7.0,<26",
    "lark>=1.3.1,<2",
    "litellm>=1.106.3,<2",
    "markdownify>=1.2.3,<2",
    "mcp>=2.3.0,<3",
    "mss>=10.2.0,<11",
    "openpyxl>=3.1.5,<4",
    "pdfplumber>=0.11.10,<0.12",
    "pillow>=13.0.0,<14",
    "playwright==1.63.*",
    "psutil>=6,<8",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "pypdf>=6.21.2,<7",
    "python-dotenv>=1.0,<2",
    "pyjwt>=2.10,<3",  # H1b: short-TTL browser session JWT (HS256)
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "sqlite-vec==0.1.*",
    "starlark-pyo3>=2026.1.3",
    "structlog>=25.4,<26",
    "typer>=0.27.3,<0.28",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[project.scripts]
auoreo = "auoreo.cli.main:main"

[project.optional-dependencies]
rtc = [
    "aiortc>=1.15,<2",
    "numpy>=2",
]
sandbox-docker = [
    "docker>=7,<8",
]
ssh = [  # W2-A: backends/environment/ssh
    "asyncssh>=2.21,<3",
]
otel = [  # W0-D: tracing + allowlisted metrics (src/auoreo/core/observability.py)
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]
sentry = [  # F3: opt-in error reporting (AUOREO_SENTRY_DSN; src/auoreo/core/observability.py)
    "sentry-sdk>=2.30,<3",
]
rerank-local = [  # W0-D: backends/rerank/cross_encoder (CPU torch on Linux/Windows)
    "sentence-transformers>=5,<6",
    "torch>=2.4",  # direct so [tool.uv.sources] can pin the CPU wheel index
]
sqlcipher = [  # W1-E: whole-file encryption of state.db (db_encryption = "sqlcipher")
    "sqlcipher3>=0.6.4,<0.7",
]
redis = [  # W1-E: multi-worker event fan-out (serve --workers N with redis_url)
    "redis>=6,<9",
]
livekit = [  # W2-D: backends/rtc_transport/livekit (SFU rooms, SIP, egress; P2 opt-in)
    "livekit-api>=1.2,<2",
    "livekit>=1.0,<2",  # F5: realtime SDK (sip_dtmf_received, publish_dtmf, TTS into a room)
]
ops = [  # G4b: tools/ops_gpu (NVML) + tools/ops_ping (ICMP; TCP-connect fallback without it)
    "nvidia-ml-py>=13",
    "ping3>=5",
]
tabular = [  # G4b: sheet_read pandas opt-in (`settings.tools.tabular_pandas`)
    "pandas>=2.3",
]
voice-stream = [  # G6: backends/stt/deepgram (raw WebSocket streaming STT)
    "websockets>=15,<18",
]
wake-porcupine = [  # G6: backends/wake/porcupine (keyed; PICOVOICE_ACCESS_KEY)
    "pvporcupine>=3",
]
age = [  # H1b: `auoreo secrets export|import` (age-encrypted backups)
    "pyrage>=1.2,<2",
]
code = [
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# --- W3-A: the wheel ships the bundled definitions + web/dist as `auoreo/_bundled/`
# (packaging/hatch_build.py; a wheel build fails without web/dist unless
# AUOREO_ALLOW_NO_WEB_DIST=1).
[tool.hatch.build.targets.wheel]
packages = ["src/auoreo"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "packaging/hatch_build.py", "README.md", "uv.lock", "alembic.ini"]

[tool.hatch.build.hooks.custom]
path = "packaging/hatch_build.py"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",  # H5: in-process fake SMTP for the plugins/email contract tests
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2.30,<3",
    "mypy>=2.4.0",
    "paho-mqtt>=2.1,<3",  # W2-D: plugins/mqtt is imported in process by its unit tests
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7",
    "pytest-httpx>=0.36.2",
    "pytest-recording>=0.13",
    "ruff>=0.17.2",
    "types-croniter>=6.2.4.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12",
    "vcrpy>=7",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures", "sdk/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "ASYNC109"]  # FastAPI/Typer defaults; explicit timeout params are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]  # short polling loops are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["tests/fixtures/", "sdk/python/"]

[[tool.mypy.overrides]]
module = ["litellm.*", "sqlite_vec.*", "markdownify.*", "keyring.*", "lark.*", "aiortc.*", "av.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]  # M5a automation
module = ["apscheduler.*", "tzlocal.*", "zeroconf", "zeroconf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]  # H1b: optional `age` extra
module = ["pyrage", "pyrage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Item .* is using the `ReadOnly` qualifier:UserWarning"]

# --- G5c: coverage gate (scripts/coverage.sh + the `coverage` CI job; not in default addopts)
[tool.coverage.run]
source = ["auoreo"]
omit = ["*/auoreo/_bundled/*"]

[tool.coverage.report]
fail_under = 0  # the global floor lives in scripts/coverage.sh (COV_FLOOR) so CI and local agree
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
