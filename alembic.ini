# Alembic config for state.db. The app migrates itself on startup (Database.init);
# this file is for `alembic ...` / `auoreo db ...` by hand.
# An empty sqlalchemy.url means "<AUOREO_HOME>/state.db" (see src/auoreo/core/alembic/env.py).

[alembic]
script_location = %(here)s/src/auoreo/core/alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
