name: telegram
version: 0.1.0
description: Telegram bot connector (long polling, pairing codes, allowlist) and delivery provider.
provides: [connector, delivery]
consumes: [sessions, "secrets:telegram/bot_token", voice]
permissions: [messaging]
config_schema:
  type: object
  properties:
    allowlist:
      type: array
      items: {type: string}
      description: Chat ids allowed to talk to the agent (added by `auoreo plugin pair telegram <code>`).
    owners:
      type: array
      items: {type: string}
      description: Paired chat ids allowed to /approve and /deny (default = every paired chat).
    agent:
      type: string
      description: Agent for Telegram sessions (default agent when unset).
    routes:
      type: array
      maxItems: 32
      description: >-
        Ordered rules that pick the agent for a message (first match wins; no match = `agent`).
        `match` is a filter over {text, user, chat_id, name}; `restrict: owners` (default) needs
        the chat in `owners`, `restrict: chat` lets any paired chat use the route.
      items:
        type: object
        properties:
          match: {type: object}
          agent: {type: string, minLength: 1}
          restrict: {type: string, enum: [owners, chat], default: owners}
        required: [match, agent]
        additionalProperties: false
    poll_timeout_s:
      type: integer
      minimum: 1
      maximum: 50
    stream:
      type: boolean
      default: false
      description: Stream replies while they are written (drafts in private chats, message edits elsewhere).
    stream_mode:
      type: string
      enum: [auto, draft, edit]
      default: auto
      description: auto = sendMessageDraft in private chats, editMessageText in groups.
    stream_interval_s:
      type: number
      minimum: 0.3
      maximum: 30
      default: 1.0
      description: Minimum seconds between two streamed updates of one chat (rate limit).
    voice:
      type: boolean
      default: false
      description: >-
        Transcribe voice notes from paired chats (needs m7.agents.voice_inbound on the host);
        the text arrives prefixed `[voice] ` and is never treated as a command.
    voice_max_seconds:
      type: integer
      minimum: 1
      maximum: 3600
      default: 120
      description: Longer voice notes (as declared by Telegram) are refused before download.
    voice_max_bytes:
      type: integer
      minimum: 1024
      maximum: 20971520
      default: 5242880
      description: Larger voice files are refused before download (getFile serves at most 20 MB).
    lock_dir:
      type: string
      description: Folder for the one-poller-per-token lock file (default = the system temp dir).
  additionalProperties: false
entry: plugin.py:Plugin
enabled: false
