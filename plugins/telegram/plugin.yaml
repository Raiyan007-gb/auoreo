name: telegram
version: 0.1.0
description: Telegram bot connector (long polling, pairing codes, allowlist) and delivery provider.
provides: [connector, delivery]
consumes: [sessions, "secrets:telegram/bot_token"]
permissions: [messaging]
config_schema:
  type: object
  properties:
    allowlist:
      type: array
      items: {type: string}
      description: Chat ids allowed to talk to the agent (added by `auoreo plugin pair telegram <code>`).
    owners:
      type: array
      items: {type: string}
      description: Paired chat ids allowed to /approve and /deny (default = every paired chat).
    agent:
      type: string
      description: Agent for Telegram sessions (default agent when unset).
    poll_timeout_s:
      type: integer
      minimum: 1
      maximum: 50
    stream:
      type: boolean
      default: false
      description: Stream replies while they are written (drafts in private chats, message edits elsewhere).
    stream_mode:
      type: string
      enum: [auto, draft, edit]
      default: auto
      description: auto = sendMessageDraft in private chats, editMessageText in groups.
    stream_interval_s:
      type: number
      minimum: 0.3
      maximum: 30
      default: 1.0
      description: Minimum seconds between two streamed updates of one chat (rate limit).
    lock_dir:
      type: string
      description: Folder for the one-poller-per-token lock file (default = the system temp dir).
  additionalProperties: false
entry: plugin.py:Plugin
enabled: false
