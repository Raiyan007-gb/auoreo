# nginx in front of `auoreo serve` (spec §25.12 L1044). Include from an `http {}` block:
#   include /etc/nginx/conf.d/auoreo.conf;
# and run auoreo on loopback (AUOREO_HOST=127.0.0.1, default port 4096) with
# AUOREO_SERVER_PASSWORD set. `auoreo doctor` checks this proxy when
# settings.json has {"i9": {"reverse_proxy_url": "https://agent.example.com"}}.
#
# Rules: SSE never buffered / gzipped and allowed to idle for an hour; /ws is an Upgrade
# passthrough (the app pings every 20 s, so 60 s idle is enough); /hooks/* is the only public
# ingress (HMAC-verified by auoreo, body capped at 1 MiB); everything else needs the bearer
# token / cookie that auoreo itself checks. X-Forwarded-* are overwritten, never appended.

upstream auoreo {
    server 127.0.0.1:4096;
    keepalive 16;
}

map $http_upgrade $auoreo_connection {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agent.example.com;
    # ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;

    client_max_body_size 25m;

    # strip-then-set: a client-supplied X-Forwarded-* never reaches auoreo
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_http_version 1.1;

    # Server-Sent Events: one long-lived response per client
    location /api/events {
        proxy_pass http://auoreo;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # WebSocket control plane
    location /ws {
        proxy_pass http://auoreo;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $auoreo_connection;
        proxy_read_timeout 60s;   # app ping every 20 s
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Public webhook ingress (HMAC-verified by auoreo); small bodies only
    location /hooks/ {
        client_max_body_size 1m;
        proxy_pass http://auoreo;
        proxy_set_header Connection "";
    }

    # Everything else: REST, MCP, the SPA (auth enforced by auoreo)
    location / {
        proxy_pass http://auoreo;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
