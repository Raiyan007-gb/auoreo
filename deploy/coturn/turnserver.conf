# coturn for AUOREO's aiortc P2P path (opt-in; spec §19.12, §26.8, F5). LiveKit does NOT need
# this: it ships an embedded TURN (deploy/livekit/livekit.yaml `turn:`).
#
# Auth is the TURN REST API: AUOREO derives short-lived credentials from the shared secret
# (username "<expiry>:<user>", password base64(HMAC-SHA1(secret, username))) and hands them to
# browsers via GET /api/rtc/ice. The secret itself is NOT in this file: compose passes
# --static-auth-secret=${TURN_SECRET} on the command line (coturn does not expand env vars in
# its config). Store the same value in AUOREO: `auoreo secrets set TURN_SECRET` and set
# settings.turn_secret_ref = "secret:TURN_SECRET", settings.turn_urls = ["turns:turn.example.com:5349"].
use-auth-secret
# static-auth-secret=${TURN_SECRET}   <- supplied by compose, never written here
realm=turn.example.com
server-name=turn.example.com

listening-port=3478
tls-listening-port=5349
# relay ports (open udp 49160-49200 on the firewall; widen for more concurrent peers)
min-port=49160
max-port=49200

cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-tcp-relay
no-multicast-peers
stale-nonce=600
user-quota=12
total-quota=1200

# Never relay to private, loopback, link-local or other special ranges (SSRF via TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
