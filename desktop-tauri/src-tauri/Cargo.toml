[package]
name = "auoreo-desktop-tauri"
version = "0.1.0"
description = "EXPERIMENTAL Tauri v2 shell for AUOREO (F7 spike, docs/spikes/tauri.md). Electron (desktop/) is the default."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
