kind: rerank
name: cross_encoder
description: >-
  Local sentence-transformers CrossEncoder (default cross-encoder/ms-marco-MiniLM-L6-v2; set
  rerank_model). Needs the `rerank-local` extra; weights download only when
  rerank_download_models is true. Inference runs in a worker thread with rerank_timeout_s.
impl: impl.py:Backend
default: false
requires_binaries: []
requires_env: []
license: Apache-2.0 (sentence-transformers; MiniLM-L6 weights Apache-2.0; bge-reranker-v2-m3 Apache-2.0)
posture: ok
