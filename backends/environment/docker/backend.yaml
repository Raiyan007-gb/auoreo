kind: environment
name: docker
description: >-
  One long-lived container per AUOREO session (settings.environment_docker_image, default
  python:3.12-slim): the working directory mounted at /work, all capabilities dropped,
  no-new-privileges, uid 1000, PID/memory limits, network settings.environment_docker_network
  (default none). Commands run with `docker exec`; the container is removed at session close.
  Needs the `sandbox-docker` extra (docker SDK) and a reachable daemon.
impl: impl.py:Backend
default: false
requires_binaries: []
requires_env: []
license: Apache-2.0
posture: ok
