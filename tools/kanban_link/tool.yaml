name: kanban_link
description: Link a kanban task to another (blocks, relates, parent, duplicates).
parameters:
  type: object
  properties:
    task_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [blocks, relates, parent, duplicates]}
    other_task_id: {type: integer, minimum: 1}
  required: [task_id, kind, other_task_id]
  additionalProperties: false
toolset: kanban
exposure: deferred
search_hint: kanban board task link depends blocks relates
default_action: allow
interactive_only: false
timeout_ms: 30000
