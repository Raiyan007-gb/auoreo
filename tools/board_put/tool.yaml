name: board_put
toolset: teams
description: Put a result on the team blackboard under a key (upsert, ≤64 KiB); mail only a pointer.
parameters:
  type: object
  properties:
    key: {type: string, pattern: "^[a-z0-9][a-z0-9._/-]{0,199}$", description: 'e.g. results/task-3, plan, summary/final'}
    value: {type: string, maxLength: 65536}
  required: [key, value]
  additionalProperties: false
permission: board
pattern_arg: key
exposure: deferred
search_hint: blackboard board artifact shared result team put write
default_action: allow
interactive_only: false
timeout_ms: 30000
