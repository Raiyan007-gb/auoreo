name: gh_api_write
toolset: github
description: Send a POST/PATCH/PUT/DELETE to a repository-scoped GitHub REST endpoint via `gh api`.
parameters:
  type: object
  properties:
    method:
      type: string
      enum:
      - POST
      - PATCH
      - PUT
      - DELETE
    endpoint:
      type: string
      minLength: 1
      maxLength: 500
      description: Path under repos/, e.g. repos/{owner}/{repo}/labels.
    fields:
      type: object
      additionalProperties:
        type:
        - string
        - integer
        - number
        - boolean
        - 'null'
      description: Body fields (strings are sent raw, never read from files). Use key[] names for arrays.
    jq:
      type: string
      maxLength: 1000
    repo:
      type: string
      description: 'owner/name (or host/owner/name). Default: the working directory''s GitHub remote;
        any other repo must match settings.github_allowed_repos.'
  additionalProperties: false
  required:
  - method
  - endpoint
permission: github_write
default_action: ask
is_destructive: true
pattern_arg: repo
exposure: deferred
timeout_ms: 120000
net: direct
sandbox_mode: read-only
requires_env:
- GH_TOKEN
- GITHUB_TOKEN
- GH_HOST
- GH_CONFIG_DIR
- HTTPS_PROXY
- NO_PROXY
- SSL_CERT_FILE
max_result_size_chars: 32000
search_hint: github rest api post patch delete write
