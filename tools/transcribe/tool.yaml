name: transcribe
toolset: voice
description: >-
  Transcribe a local audio file (wav, mp3, m4a, ogg, webm, flac; up to 25 MB) to text with the
  selected speech-to-text backend. Silence is rejected with "no speech detected".
parameters:
  type: object
  properties:
    path: {type: string, description: "Audio file path (absolute or relative to the working directory)."}
    language: {type: string, description: "ISO-639-1 language code; omit to auto-detect."}
  required: [path]
  additionalProperties: false
permission: read
pattern_arg: path
default_action: allow
is_read_only: true
is_concurrency_safe: true
exposure: deferred
timeout_ms: 300000
search_hint: transcribe audio speech to text stt voice recording whisper
