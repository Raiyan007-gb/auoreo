name: gh_issue_create
toolset: github
description: Open a GitHub issue via gh.
parameters:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 256
    body:
      type: string
      minLength: 1
      maxLength: 60000
      description: Markdown body. Refused if it looks like it contains a secret.
    labels:
      type: array
      items:
        type: string
        maxLength: 100
      maxItems: 10
    repo:
      type: string
      description: 'owner/name (or host/owner/name). Default: the working directory''s GitHub remote;
        any other repo must match settings.github_allowed_repos.'
  additionalProperties: false
  required:
  - title
  - body
permission: github_write
default_action: ask
is_destructive: true
pattern_arg: repo
exposure: deferred
timeout_ms: 120000
net: proxy
sandbox_mode: read-only
requires_env:
- GH_TOKEN
- GITHUB_TOKEN
- GH_HOST
- GH_CONFIG_DIR
- HTTPS_PROXY
- NO_PROXY
- SSL_CERT_FILE
max_result_size_chars: 32000
search_hint: github create issue bug report
