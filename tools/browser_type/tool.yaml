name: browser_type
toolset: browser
description: "Fill a field by `ref`/`selector`; `submit` presses Enter."
parameters:
  type: object
  properties:
    ref: {type: string, description: "Element ref from the latest snapshot, e.g. e3"}
    selector: {type: string, description: "CSS selector (when no ref fits)"}
    text: {type: string}
    submit: {type: boolean, default: false}
  required: [text]
  additionalProperties: false
default_action: allow
is_read_only: false
is_concurrency_safe: false
timeout_ms: 30000
search_hint: browser type fill input form
net: proxy
