name: ask_user_question
toolset: interaction
description: >-
  Ask the user 1–5 questions in one form, each optionally with 2–4 options (put the
  recommended option first). A free-text answer is allowed unless `allowCustom: false`.
  Unanswered after `timeout_s` (default 60) → `timed_out: true`; then pick a sensible default.
  Use only when you cannot proceed with a sensible default.
parameters:
  type: object
  properties:
    questions:
      type: array
      minItems: 1
      maxItems: 5
      items:
        type: object
        properties:
          question: {type: string, minLength: 1}
          header: {type: string, maxLength: 20}
          options:
            type: array
            minItems: 2
            maxItems: 4
            items:
              type: object
              properties:
                label: {type: string, minLength: 1}
                description: {type: string}
              required: [label]
              additionalProperties: false
          multiSelect: {type: boolean, default: false}
          allowCustom:
            type: boolean
            default: true
            description: Allow a free-text answer (returned as customText); false = options only.
        required: [question]
        additionalProperties: false
    timeout_s:
      type: integer
      minimum: 5
      maximum: 600
      default: 60
      description: Seconds to wait for the user before returning timed_out.
  required: [questions]
  additionalProperties: false
default_action: allow
interactive_only: true
timeout_ms: 600000
search_hint: ask user clarify question choice
