name: update_plan
toolset: planning
description: Record or update the current plan as ordered steps with a status each.
parameters:
  type: object
  properties:
    explanation: {type: string}
    steps:
      type: array
      minItems: 1
      maxItems: 30
      items:
        type: object
        properties:
          step: {type: string, minLength: 1}
          status: {type: string, enum: [pending, in_progress, completed]}
          done_when:
            type: string
            maxLength: 500
            description: How to verify the step is done (a check or a command); verify_plan requires it.
        required: [step, status]
        additionalProperties: false
  required: [steps]
  additionalProperties: false
default_action: allow
is_read_only: true
timeout_ms: 5000
search_hint: plan steps update status
