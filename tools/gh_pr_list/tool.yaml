name: gh_pr_list
toolset: github
description: List GitHub pull requests via gh.
parameters:
  type: object
  properties:
    state:
      type: string
      enum:
      - open
      - closed
      - merged
      - all
      default: open
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Max items.
    author:
      type: string
      maxLength: 100
    label:
      type: string
      maxLength: 100
    base:
      type: string
      maxLength: 200
      description: Base branch filter.
    search:
      type: string
      maxLength: 500
      description: GitHub search query, e.g. 'review:required'.
    repo:
      type: string
      description: 'owner/name (or host/owner/name). Default: the working directory''s GitHub remote;
        any other repo must match settings.github_allowed_repos.'
  additionalProperties: false
permission: github_read
default_action: allow
is_read_only: true
is_concurrency_safe: true
pattern_arg: repo
exposure: deferred
timeout_ms: 120000
net: direct
sandbox_mode: read-only
requires_env:
- GH_TOKEN
- GITHUB_TOKEN
- GH_HOST
- GH_CONFIG_DIR
- HTTPS_PROXY
- NO_PROXY
- SSL_CERT_FILE
max_result_size_chars: 32000
search_hint: github pull requests list open prs
