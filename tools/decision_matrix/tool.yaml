name: decision_matrix
toolset: analyst
description: Rank options by weighted criteria (scores 0–10) with a sensitivity check; markdown out.
parameters:
  type: object
  properties:
    criteria:
      type: array
      minItems: 1
      maxItems: 30
      items:
        type: object
        properties:
          name: {type: string, minLength: 1, maxLength: 60}
          weight: {type: number, exclusiveMinimum: 0, description: Relative weight (normalised to sum 1).}
          direction: {type: string, enum: [max, min], default: max, description: 'min = lower score is better (e.g. cost).'}
        required: [name, weight]
        additionalProperties: false
    options:
      type: array
      minItems: 2
      maxItems: 30
      items:
        type: object
        properties:
          name: {type: string, minLength: 1, maxLength: 60}
          scores:
            type: object
            description: Criterion name → score 0–10.
            additionalProperties: {type: number, minimum: 0, maximum: 10}
        required: [name, scores]
        additionalProperties: false
  required: [criteria, options]
  additionalProperties: false
exposure: deferred
search_hint: decision matrix weighted criteria options rank compare tradeoff analyst
default_action: allow
is_read_only: true
is_concurrency_safe: true
interactive_only: false
timeout_ms: 10000
