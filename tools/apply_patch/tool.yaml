name: apply_patch
toolset: files
description: |-
  Apply a multi-file patch. Format:
  *** Begin Patch
  *** Add File: path/new.py
  +line of the new file
  *** Update File: path/old.py
  *** Move to: path/renamed.py      (optional)
  @@ class Foo                       (optional; stack @@ lines to narrow: @@ class Foo / @@ def bar():)
   unchanged context line
  -removed line
  +added line
  *** End of File                   (optional: the hunk is at the end of the file)
  *** Delete File: path/gone.py
  *** End Patch
  Hunks of a file apply in order. Context and removed lines must match the file (exact,
  else ignoring whitespace); without an @@ header a hunk must match uniquely. The patch is
  validated completely before any file is changed; language-server diagnostics for the
  changed files are returned when a server is running.
parameters:
  type: object
  properties:
    patch: {type: string}
    dry_run: {type: boolean, default: false, description: Validate and show the plan only.}
  required: [patch]
  additionalProperties: false
permission: edit
default_action: ask
is_destructive: true
timeout_ms: 30000
search_hint: patch diff multiple files add update delete move
