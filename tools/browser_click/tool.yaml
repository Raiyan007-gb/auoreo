name: browser_click
toolset: browser
description: "Click an element by `ref` (or CSS `selector`); returns the new snapshot."
parameters:
  type: object
  properties:
    ref: {type: string, description: "Element ref from the latest snapshot, e.g. e3"}
    selector: {type: string, description: "CSS selector (when no ref fits)"}
  additionalProperties: false
default_action: allow
is_read_only: false
is_concurrency_safe: false
timeout_ms: 30000
search_hint: browser click link button
net: proxy
