name: gh_run_list
toolset: github
description: List recent GitHub Actions workflow runs via gh.
parameters:
  type: object
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Max items.
    branch:
      type: string
      maxLength: 200
    workflow:
      type: string
      maxLength: 200
      description: Workflow name or file.
    status:
      type: string
      enum:
      - queued
      - in_progress
      - completed
      - success
      - failure
      - cancelled
    event:
      type: string
      maxLength: 50
    repo:
      type: string
      description: 'owner/name (or host/owner/name). Default: the working directory''s GitHub remote;
        any other repo must match settings.github_allowed_repos.'
  additionalProperties: false
permission: github_read
default_action: allow
is_read_only: true
is_concurrency_safe: true
pattern_arg: repo
exposure: deferred
timeout_ms: 120000
net: proxy
sandbox_mode: read-only
requires_env:
- GH_TOKEN
- GITHUB_TOKEN
- GH_HOST
- GH_CONFIG_DIR
- HTTPS_PROXY
- NO_PROXY
- SSL_CERT_FILE
max_result_size_chars: 32000
search_hint: github actions workflow runs ci list
