name: kanban_unblock
description: 'Orchestrator: return a blocked kanban task to ready (failure count reset), with an optional note.'
parameters:
  type: object
  properties:
    task_id: {type: integer, minimum: 1}
    note: {type: string, maxLength: 5000}
  required: [task_id]
  additionalProperties: false
toolset: kanban
exposure: deferred
search_hint: kanban board task unblock retry blocked
default_action: allow
interactive_only: false
timeout_ms: 30000
