name: jobs_list
toolset: shell
description: >-
  List this session's background jobs: exec_command processes still running (start one in
  the background with exec_command yield_time_ms=0) and open terminal_pty sessions.
parameters:
  type: object
  properties: {}
  additionalProperties: false
permission: jobs
default_action: allow
is_read_only: true
is_concurrency_safe: true
exposure: deferred
timeout_ms: 10000
search_hint: background jobs list running processes shells
net: none
sandbox_mode: read-only
