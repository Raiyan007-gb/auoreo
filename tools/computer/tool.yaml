name: computer
toolset: computer
description: >-
  Control the desktop: observe (screenshot, list_windows, list_apps), act (click,
  double_click, right_click, middle_click, set_value, type, key, scroll, drag, focus_app,
  wait) and verify. `target` is an element token from the last screenshot (som/ax mode) or
  "x,y" in relative 0-1000 coordinates of the primary display (500,500 = centre). Element
  tokens go stale after any action unless capture_after was set; acting is refused when the
  focused window changed since your last screenshot (take a new one). Mutating actions return
  a fresh screenshot plus a verdict: confirmed (done), unverifiable (verify the fresh state)
  or suspected_noop (escalate, e.g. try foreground).
  delivery_mode "background" (default) never steals focus; "foreground" needs a separate
  approval - use it only after a background attempt did not land. Lock/logout/shutdown key
  combos and dangerous typed shell commands are refused.
parameters:
  type: object
  properties:
    op:
      type: string
      enum: [click, double_click, right_click, middle_click, middle, set_value, type, key, scroll, drag, screenshot, wait, focus_app, list_windows, list_apps]
    target: {type: string, description: "Element ref from the last state read, or \"x,y\" (0-1000); app name for focus_app."}
    to: {type: string, description: "drag destination \"x,y\" (0-1000)."}
    text: {type: string, maxLength: 10000, description: "Text for op=type, or the new value for op=set_value."}
    key: {type: string, description: "Key or combo for op=key, e.g. \"enter\", \"cmd+s\", \"ctrl+shift+t\"."}
    direction: {type: string, enum: [up, down, left, right], description: "op=scroll direction (default down)."}
    amount: {type: integer, minimum: 1, maximum: 50, description: "Scroll steps, or seconds for op=wait (max 10)."}
    delivery_mode: {type: string, enum: [background, foreground], default: background}
    bring_to_front: {type: boolean, default: false, description: "Raise `app` to the front before acting (needs delivery_mode=foreground)."}
    app: {type: string, maxLength: 200, description: "App to raise for bring_to_front."}
    mode: {type: string, enum: [som, vision, ax], description: "Observation mode: som (marked elements + screenshot, default), vision (pixels), ax (accessibility tree text)."}
    capture_after: {type: boolean, default: false, description: "Re-read the screen state after a mutating op so element tokens stay valid for the next step."}
    pid: {type: integer, description: "Process id of the window to target (sticky with window_id)."}
    window_id: {type: integer, description: "Window id to target; sticks for later ops until another window or focus_app."}
  required: [op]
  additionalProperties: false
permission: computer
pattern_arg: op
default_action: ask
is_read_only: false
is_destructive: true
is_concurrency_safe: false
timeout_ms: 120000
search_hint: computer desktop control click type keyboard mouse screen app window gui automate
