name: kanban_list
description: List tasks on a kanban board, optionally filtered by status.
parameters:
  type: object
  properties:
    board: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", default: default}
    status: {type: string, enum: [ready, claimed, blocked, done]}
  additionalProperties: false
is_read_only: true
is_concurrency_safe: true
toolset: kanban
exposure: deferred
search_hint: kanban board task queue claim worker
default_action: allow
interactive_only: false
timeout_ms: 30000
