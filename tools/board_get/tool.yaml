name: board_get
toolset: teams
description: Read one key from the team blackboard.
parameters:
  type: object
  properties:
    key: {type: string, pattern: "^[a-z0-9][a-z0-9._/-]{0,199}$"}
  required: [key]
  additionalProperties: false
permission: board
pattern_arg: key
exposure: deferred
search_hint: blackboard board artifact shared result team get read
default_action: allow
is_read_only: true
is_concurrency_safe: true
is_search_or_read: true
interactive_only: false
timeout_ms: 30000
max_result_size_chars: 70000
