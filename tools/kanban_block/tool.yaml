name: kanban_block
description: >-
  Report that you could not finish a task. The first failure returns it to ready for
  another attempt; the second blocks it.
parameters:
  type: object
  properties:
    task_id: {type: integer, minimum: 1}
    reason: {type: string, minLength: 1, maxLength: 5000}
    worker: {type: string, minLength: 1, maxLength: 64, description: Worker name (defaults to this session id).}
  required: [task_id, reason]
  additionalProperties: false
toolset: kanban
exposure: deferred
search_hint: kanban board task queue claim worker
default_action: allow
interactive_only: false
timeout_ms: 30000
