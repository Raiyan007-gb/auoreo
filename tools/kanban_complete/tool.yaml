name: kanban_complete
description: Mark a claimed kanban task done, with an optional result summary.
parameters:
  type: object
  properties:
    task_id: {type: integer, minimum: 1}
    summary: {type: string, maxLength: 20000}
    worker: {type: string, minLength: 1, maxLength: 64, description: Worker name (defaults to this session id).}
  required: [task_id]
  additionalProperties: false
toolset: kanban
exposure: deferred
search_hint: kanban board task queue claim worker
default_action: allow
interactive_only: false
timeout_ms: 30000
