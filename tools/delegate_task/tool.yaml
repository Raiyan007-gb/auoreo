name: delegate_task
toolset: teams
description: 'Run a self-contained task in a subagent (goal), or several at once (tasks[], at most 3 run concurrently); returns <task-notification>s. action=list|steer|stop manages your subagents.'
parameters:
  type: object
  properties:
    goal:
      type: string
      minLength: 1
      maxLength: 20000
      description: >-
        What the subagent must achieve. Give the subagent everything it needs in goal/context (purpose, files as path:line, what done means). Foreground waits for the result; background=true returns at once and the result arrives later as an injected <task-notification> message. With output_schema the child's final answer must be JSON valid for that schema (one automatic retry).
    context: {type: string, maxLength: 50000, description: Background, constraints, relevant files.}
    agent: {type: string, default: default, description: Agent folder to run (e.g. implementer, reviewer).}
    name: {type: string, pattern: "^[a-z0-9_]{1,64}$", description: Unique task name in the team.}
    background: {type: boolean, default: false}
    model: {type: string, description: Optional model alias/group override for the child.}
    output_schema: {type: object, description: JSON Schema the child's final answer must satisfy.}
    role: {type: string, enum: [worker, supervisor], description: supervisor needs teams_orchestrator_enabled.}
    action:
      type: string
      enum: [spawn, list, steer, stop]
      default: spawn
      description: >-
        spawn (default) starts subagents; list shows this session's subagents; steer sends
        message to a running one (arrives at its next step); stop interrupts one. list/steer/stop
        bypass the pause switch and depth limit.
    subagent_id: {type: string, minLength: 1, maxLength: 64, description: "steer/stop: task id (or name) of your subagent."}
    message: {type: string, minLength: 1, maxLength: 20000, description: "steer: what to tell the running subagent."}
    mode:
      type: string
      enum: [spawn, fork]
      default: spawn
      description: spawn = fresh context; fork = the child starts with a summary of this conversation.
    budget:
      type: object
      description: Per-child limits; exhaustion forces one summarise-now reply, then TOOL_BUDGET_EXCEEDED.
      properties:
        max_tokens: {type: integer, minimum: 1}
        max_usd: {type: number, exclusiveMinimum: 0}
        timeout_ms: {type: integer, minimum: 1000, maximum: 86400000}
      additionalProperties: false
    tasks:
      type: array
      minItems: 1
      maxItems: 10
      description: >-
        Batch mode instead of goal: independent tasks run in parallel (3 at a time); a
        foreground batch returns all task-notifications joined in task order.
      items:
        type: object
        properties:
          goal: {type: string, minLength: 1, maxLength: 20000}
          context: {type: string, maxLength: 50000}
          agent: {type: string}
          name: {type: string, pattern: "^[a-z0-9_]{1,64}$"}
          model: {type: string}
          output_schema: {type: object}
          mode: {type: string, enum: [spawn, fork]}
          budget:
            type: object
            properties:
              max_tokens: {type: integer, minimum: 1}
              max_usd: {type: number, exclusiveMinimum: 0}
              timeout_ms: {type: integer, minimum: 1000, maximum: 86400000}
            additionalProperties: false
        required: [goal]
        additionalProperties: false
  additionalProperties: false
permission: delegate
pattern_arg: agent
default_action: ask
interactive_only: false
timeout_ms: 3600000
search_hint: subagent spawn delegate parallel task child agent
