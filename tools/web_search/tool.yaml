name: web_search
toolset: web
description: >-
  Search the web and return the top results as title, URL and snippet. Follow up with
  web_fetch on a result URL to read the page. Uses the configured search backends in order
  (Exa, Parallel, Brave, Tavily, Jina, Firecrawl, SearXNG); answers are cached for a day.
  Fails clearly when none is configured.
parameters:
  type: object
  properties:
    query: {type: string, minLength: 1, maxLength: 500}
    max_results: {type: integer, minimum: 1, maximum: 20, default: 8}
    topic: {type: string, enum: [general, news], default: general, description: "news: fresher results (1 h cache)."}
    timeout_s: {type: number, minimum: 1, maximum: 60, description: "Per-backend timeout for this call (default 20 s, max 60 s)."}
  required: [query]
  additionalProperties: false
permission: websearch
pattern_arg: query
default_action: allow
is_read_only: true
is_concurrency_safe: true
is_search_or_read: true
requires_env:  # scoped secret reads (spec §25.11), one per backends/search provider
  [EXA_API_KEY, PARALLEL_API_KEY, BRAVE_API_KEY, TAVILY_API_KEY, JINA_API_KEY, FIRECRAWL_API_KEY]
timeout_ms: 200000
search_hint: web search internet query find pages news
net: proxy
