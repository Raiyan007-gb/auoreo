name: memory
toolset: memory
description: >-
  Save durable, non-obvious knowledge for future sessions. Batch of operations, applied
  all-or-nothing. target=fact stores a searchable fact; target=user edits USER.md
  (who the user is); target=memory edits the MEMORY.md index; target=prefs only PROPOSES a
  PREFS.md change (add/replace/remove) that a human must approve — it is never written
  directly, so say so to the user and include a short `reason`.
  Never save secrets, things derivable from the code, or temporary task state.
parameters:
  type: object
  properties:
    operations:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: object
        properties:
          action:
            type: string
            enum: [add, replace, remove, forget, pin, unpin, feedback]
            description: >-
              Facts are never deleted: remove/forget archive them; replace supersedes the old
              fact. pin keeps a fact from curation; feedback rates a recalled fact (helpful).
              forget, pin, unpin and feedback are fact-only.
          target: {type: string, enum: [fact, user, memory, prefs]}
          content: {type: string, maxLength: 2000}
          old_text: {type: string, description: Unique substring identifying the entry to change.}
          helpful: {type: boolean, description: "feedback only: was the recalled fact useful?"}
          reason: {type: string, maxLength: 500, description: "prefs only: why you propose this preference."}
        required: [action, target]
        additionalProperties: false
  required: [operations]
  additionalProperties: false
default_action: allow
timeout_ms: 30000
search_hint: remember save fact preference long term memory
