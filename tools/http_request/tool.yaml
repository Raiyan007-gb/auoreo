name: http_request
toolset: web
description: >-
  Make an HTTP request to a public API (GET/POST/PUT/PATCH/DELETE) and return status,
  headers and body. Private and loopback addresses are blocked. Each new URL needs approval
  unless a permission rule allows it.
parameters:
  type: object
  properties:
    method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD], default: GET}
    url: {type: string}
    headers: {type: object, additionalProperties: {type: string}}
    body: {type: string, description: Raw request body (JSON as a string).}
    max_chars: {type: integer, minimum: 100, maximum: 200000, default: 20000}
  required: [url]
  additionalProperties: false
permission: http
pattern_arg: url
default_action: ask
timeout_ms: 60000
exposure: deferred
search_hint: call REST API http request post json
