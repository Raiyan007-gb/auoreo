# Bundled permission rules (lowest precedence). Evaluation: last matching rule wins
# across layers bundled → project → runtime → agent → session → approved.
# Unmatched → the tool's `default_action`.
rules:
  - {permission: read, pattern: "*", action: allow}
  - {permission: read, pattern: "*.env", action: deny}
  - {permission: read, pattern: "*.env.*", action: deny}
  - {permission: read, pattern: "*.env.example", action: allow}
  - {permission: read, pattern: "*secrets.db", action: deny}
  - {permission: edit, pattern: "*", action: ask}
  - {permission: edit, pattern: "*.env", action: deny}
  - {permission: edit, pattern: "*secrets.db", action: deny}
  - {permission: bash, pattern: "*", action: ask}
  - {permission: bash, pattern: "ls", action: allow}
  - {permission: bash, pattern: "ls *", action: allow}
  - {permission: bash, pattern: "pwd", action: allow}
  - {permission: bash, pattern: "git status*", action: allow}
  - {permission: bash, pattern: "git diff*", action: allow}
  - {permission: bash, pattern: "git log*", action: allow}
  - {permission: webfetch, pattern: "*", action: ask}
  # Teams: delegate_task defaults to `ask`; allow it so delegation works headless (M5d).
  - {permission: delegate, pattern: "*", action: allow}
# Extra shell deny-globs (unbypassable, checked before any mode, even yolo).
floors:
  - "*git push --force*"
  - "*git push -f *"
  # PowerShell (the `pwsh` tool checks its script as the `bash` pattern). Globs are also
  # matched against a lowercased variant of the command, so they are written in lowercase.
  - "*remove-item*-recurse* /"
  - "*remove-item* / *-recurse*"
  - "*remove-item*-recurse* c:\\"
  - "*remove-item*-recurse* c:/"
  - "*remove-item* c:\\ *-recurse*"
  - "*remove-item*-recurse* $env:systemdrive*"
  - "*format-volume*"
  - "*clear-disk*"
  - "*stop-computer*"
  - "*restart-computer*"
  - "*iex*(iwr *"
  - "*iex*(irm *"
  - "*iex*(new-object*downloadstring*"
  - "*invoke-expression*(invoke-webrequest*"
  - "*invoke-expression*(invoke-restmethod*"
  - "*invoke-expression*(new-object*downloadstring*"
  - "*iwr *|*iex*"
  - "*irm *|*iex*"
  - "*invoke-webrequest*|*invoke-expression*"
  - "*invoke-restmethod*|*invoke-expression*"
