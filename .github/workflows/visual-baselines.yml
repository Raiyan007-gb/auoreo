name: visual baselines
# Screenshot baselines are per platform (text rasterises differently on Linux, Windows and macOS).
# Run this by hand (Actions → visual baselines → Run workflow), download the artifact and commit its
# PNGs to web/e2e/visual.spec.ts-snapshots/; from then on `ci` compares Linux screenshots too.
# Re-run it after an intended design change, review the diff in the pull request, then commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - working-directory: web
        run: npm ci && npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e:visual -- --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-linux
          path: web/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
