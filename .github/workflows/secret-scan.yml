name: secret-scan
# G5c: gitleaks over the pushed history (PRs: only the PR's commits). Uses the gitleaks CLI
# directly (no gitleaks-action license needed); config + allowlists in .gitleaks.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE" ]; then range=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif "${range[@]}"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
