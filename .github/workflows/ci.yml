name: ci
# Every action is pinned by commit SHA (version in the trailing comment); Dependabot
# (.github/dependabot.yml) proposes the bumps.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run auoreo harness validate
      - run: uv run python scripts/verify_tool_catalog.py --check
      - run: ./scripts/run_tests.sh
  ty:
    # spec §25.15 L1090: `ty check` alongside mypy. ty is pre-1.0 (0.0.x), so the job is
    # informational until it reaches parity: it never blocks a merge.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - run: uvx ty@0.0.92 check src --python .venv --output-format concise
  coverage:
    # G5c: global + per-file coverage floors (scripts/coverage.sh), then the evidence manifest
    # (lint/type/openapi/harness gates + the junit/coverage totals) uploaded as an artifact.
    # Cassette-backed provider tests replay only (pytest-recording record mode `none`).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - run: ./scripts/coverage.sh
      - run: uv run python scripts/evidence.py --skip pytest
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: .artifacts/
  memory-eval:
    # I4 (spec §25.8 L996): the generated memory golden set must be current, and retrieval
    # must keep recall@10 / p95 within evals/memory/gate.json (fake hashed embeddings, no keys).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - run: uv run python scripts/gen_memory_golden.py --check
      - run: uv run python scripts/eval_memory.py --golden evals/memory/golden.jsonl --backend none --gate evals/memory/gate.json
  launchers:
    # npm launcher + Electron shell helpers + the shell installer: no npm install, no Electron.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node packages/npm/scripts/sync-version.mjs --check
      - run: node --test "packages/npm/test/*.test.mjs" "desktop/test/*.test.mjs"
      - name: shellcheck scripts/install.sh
        run: shellcheck --shell=sh scripts/install.sh
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:types && git diff --exit-code -- sdk/types.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  e2e:
    # Playwright against a keyless server (`AUOREO_GATEWAY=fake`, booted by web/e2e/run.mjs): the
    # functional specs, the axe accessibility gate and the keyboard gate (all `*.spec.ts`), then the
    # screenshot comparison (skips on a platform without committed baselines; see visual-baselines.yml).
    # The Windows leg is informational for now (`continue-on-error`): it must stay green for a while
    # before it blocks a merge.
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        working-directory: web
        run: npx playwright install chromium
      - working-directory: web
        run: npm run e2e
      - working-directory: web
        run: npm run e2e:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: web/test-results/
          if-no-files-found: ignore
