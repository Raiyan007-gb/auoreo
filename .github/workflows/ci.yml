name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --no-extra rerank-local
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run auoreo harness validate
      - run: ./scripts/run_tests.sh
  launchers:
    # npm launcher + Electron shell helpers: plain node --test, no npm install, no Electron.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node packages/npm/scripts/sync-version.mjs --check
      - run: node --test "packages/npm/test/*.test.mjs" "desktop/test/*.test.mjs"
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:types && git diff --exit-code -- sdk/types.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
