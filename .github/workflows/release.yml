name: release
# Tag v<version> → PyPI (trusted publishing), GHCR multi-arch image, PyInstaller onefile
# binaries + SHA256SUMS, npm launcher (provenance), Electron desktop builds,
# signed update manifests, GitHub Release. See docs/release.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - name: version == tag guard
        run: uv run --no-project python scripts/check_version_tag.py "$GITHUB_REF_NAME"
      - id: meta
        name: version + channel
        run: |
          v="${GITHUB_REF_NAME#v}"
          channel=stable
          if [[ "$v" =~ dev ]]; then channel=dev
          elif [[ "$v" =~ (a|b|rc)[0-9]*$ ]]; then channel=beta; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  web:
    needs: guard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  python-dist:
    needs: [guard, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # the hatch build hook fails without web/dist/index.html (never ship a bare wheel)
      - run: uv build
      - name: wheel carries the bundled definitions and the SPA
        run: |
          unzip -l dist/*.whl | grep -q 'auoreo/_bundled/web/dist/index.html'
          unzip -l dist/*.whl | grep -q 'auoreo/_bundled/agents/default/AGENT.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: python-dist
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # pep440: 1.2.3 → 1.2.3, 1.2, latest; 1.3.0rc1 → 1.3.0rc1 only (no latest)
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: [guard, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, exe: "" }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, exe: "" }
          - { os: macos-14, platform: macos-arm64, exe: "" }
          - { os: windows-latest, platform: windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # Azure artifact signing (OIDC)
    env:
      MACOS_CERT: ${{ secrets.MACOS_CERT }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ASSET: dist/auoreo-${{ matrix.platform }}${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: uv sync --locked --no-dev --extra rtc
      - run: uv run --no-sync --with "pyinstaller>=6.22,<7" python scripts/build_binary.py --platform-name
        shell: bash
      - name: smoke test (version == tag, doctor on the fake gateway)
        shell: bash
        env:
          AUOREO_GATEWAY: fake
        run: |
          test "$("$ASSET" --version)" = "${{ needs.guard.outputs.version }}"
          "$ASSET" doctor --json > doctor.json || true
          head -c 2000 doctor.json

      - name: macOS — import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERT != ''
        run: |
          echo "$MACOS_CERT" | base64 --decode > cert.p12
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain
          rm cert.p12
      - name: macOS — codesign + notarize
        if: runner.os == 'macOS' && env.MACOS_CERT != ''
        run: |
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$ASSET"
          codesign --verify --strict --verbose=2 "$ASSET"
          ditto -c -k --keepParent "$ASSET" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
      - name: Windows — Azure login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Windows — Authenticode sign (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\auoreo-windows-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  binary-musl:
    # Alpine (musl) build inside a container: JavaScript actions cannot run in Alpine job
    # containers, so the build is one `docker run`. Experimental until every dependency
    # ships musllinux wheels; a failure does not block the release.
    needs: [guard, web]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: build in python:3.12-alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12-alpine sh -euc '
            apk add --no-cache build-base linux-headers libffi-dev zlib-dev git
            pip install --no-cache-dir "uv==0.11.32"
            uv sync --locked --no-dev --extra rtc
            uv run --no-sync --with "pyinstaller>=6.22,<7" python scripts/build_binary.py --platform-name
            test "$(dist/auoreo-linux-x64-musl --version)" = "${{ needs.guard.outputs.version }}"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-linux-x64-musl
          path: dist/auoreo-linux-x64-musl
          if-no-files-found: error

  github-release:
    needs: [guard, python-dist, binaries, binary-musl, image]
    if: ${{ !cancelled() && needs.python-dist.result == 'success' && needs.binaries.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: python-dist
      - name: SHA256SUMS
        working-directory: binaries
        run: sha256sum auoreo-* > SHA256SUMS && cat SHA256SUMS
      - name: signed update manifests
        if: env.UPDATE_SIGNING_KEY != ''
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python packaging/sign_manifest.py build \
            --version "$VERSION" --assets-dir binaries --out-dir manifests \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
      - name: create the GitHub Release
        run: |
          pre=()
          if [ "${{ needs.guard.outputs.channel }}" != "stable" ]; then pre=(--prerelease); fi
          files=(binaries/* python-dist/* scripts/install.sh)
          if compgen -G "manifests/*.json" >/dev/null; then files+=(manifests/*.json); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${pre[@]}" "${files[@]}"
      - name: publish manifests to the rolling `updates` release (what `auoreo upgrade` reads)
        if: env.UPDATE_SIGNING_KEY != ''
        run: |
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease \
            --title "Update manifests" --notes "Signed manifest-<channel>.json files read by auoreo upgrade."
          gh release upload updates manifests/*.json --clobber

  npm:
    # I9 (spec §24.10 L893): npm launcher + per-platform binary packages, with provenance.
    # Auth: npm trusted publishing (OIDC, `id-token: write`) when the packages are configured
    # for this workflow; otherwise the `NPM_TOKEN` secret. Without either the job is skipped.
    needs: [guard, binaries]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      CHANNEL: ${{ needs.guard.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: version == tag guard (npm semver of the PEP 440 tag)
        run: |
          node packages/npm/scripts/sync-version.mjs --check
          want="$(node -e 'import("./packages/npm/scripts/sync-version.mjs").then(m => console.log(m.toSemver(process.argv[1])))' "${GITHUB_REF_NAME#v}")"
          have="$(node -p 'require("./packages/npm/package.json").version')"
          test "$want" = "$have" || { echo "packages/npm is $have but the tag needs $want"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - run: node packages/npm/scripts/pack-platforms.mjs --artifacts binaries --out packages/npm/dist
      - name: publish (platform packages first, then the launcher)
        run: |
          tag=latest
          if [ "$CHANNEL" != "stable" ]; then tag="$CHANNEL"; fi
          for dir in packages/npm/dist/*/; do
            npm publish "$dir" --provenance --access public --tag "$tag"
          done
          npm publish packages/npm --provenance --access public --tag "$tag"

  desktop:
    # I9 (spec §25.15 L1095): Electron shell per OS, published to this release with the update
    # channel files electron-updater reads (`AUOREO_CHANNEL`). Signing/notarisation only run when
    # their secrets exist; otherwise the build is unsigned (auto-discovery disabled).
    needs: [guard, binaries, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, artifact: auoreo-macos-arm64, dest: mac-arm64/auoreo, args: --mac }
          - { os: windows-latest, artifact: auoreo-windows-x64.exe, dest: win-x64/auoreo.exe, args: --win }
          - { os: ubuntu-latest, artifact: auoreo-linux-x64, dest: linux-x64/auoreo, args: --linux --x64 }
          - { os: ubuntu-24.04-arm, artifact: auoreo-linux-arm64, dest: linux-arm64/auoreo, args: --linux --arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      AUOREO_CHANNEL: ${{ needs.guard.outputs.channel }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
      WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.artifact == 'auoreo-macos-arm64' && 'macos-arm64' || matrix.artifact == 'auoreo-windows-x64.exe' && 'windows-x64' || matrix.artifact == 'auoreo-linux-arm64' && 'linux-arm64' || 'linux-x64' }}
          path: desktop/staging
      - name: stage the binary + set the version
        run: |
          mkdir -p "resources/bin/$(dirname "${{ matrix.dest }}")"
          cp "staging/${{ matrix.artifact }}" "resources/bin/${{ matrix.dest }}"
          chmod 0755 "resources/bin/${{ matrix.dest }}"
          npm version --no-git-tag-version --allow-same-version "$(node -e 'import("../packages/npm/scripts/sync-version.mjs").then(m => console.log(m.toSemver(process.argv[1])))' "${GITHUB_REF_NAME#v}")"
      - name: macOS signing secrets (only when present)
        if: runner.os == 'macOS' && env.CSC_LINK_SECRET != ''
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "CSC_LINK=$CSC_LINK"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Windows signing secrets (only when present)
        if: runner.os == 'Windows' && env.WIN_CSC_LINK_SECRET != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          {
            echo "WIN_CSC_LINK=$WIN_CSC_LINK"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: unsigned build (no certificate configured)
        if: env.CSC_LINK_SECRET == '' && env.WIN_CSC_LINK_SECRET == ''
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish always
