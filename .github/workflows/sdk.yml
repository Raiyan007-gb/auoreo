name: sdk
on:
  pull_request:
    paths: ["src/auoreo/schema/**", "src/auoreo/api/**", "web/sdk/**", "sdk/python/**", "scripts/gen_sdk.sh"]
permissions:
  contents: read
jobs:
  openapi-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run python scripts/check_openapi.py --check
      - name: Python SDK drift (openapi-python-client, pinned in scripts/gen_sdk.sh)
        run: |
          ./scripts/gen_sdk.sh
          git add -N sdk/python
          git diff --exit-code -- sdk/python
