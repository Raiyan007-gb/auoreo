name: sdk
on:
  pull_request:
    paths: ["src/auoreo/schema/**", "src/auoreo/api/**", "web/sdk/**"]
permissions:
  contents: read
jobs:
  openapi-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked
      - run: uv run python scripts/check_openapi.py --check
